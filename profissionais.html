<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profissionais | Protege</title><link rel="stylesheet" href="style.css?v=9">
</head>
<body class="app-page" data-requires-auth="true">
  <aside class="sidebar"><div class="sidebar-brand"><img src="logo-protege.jpeg" alt="Protege"></div><nav>
    <a href="dashboard.html">Dashboard</a><a href="familias-interessadas.html">Famílias interessadas <span id="sidebarLeadCount" class="nav-badge">0</span></a>
    <a class="active" href="profissionais.html">Profissionais</a><a href="#">Agenda</a><a href="familias.html">Famílias</a><a href="#">Filhos</a><a href="atendimentos.html">Atendimentos</a><a href="#">Relatórios</a>
  </nav><button id="logoutBtn" class="sidebar-logout">Sair</button></aside>
  <main class="app-main">
    <header class="app-topbar"><div><span class="section-label">EQUIPE</span><h1>Profissionais</h1><p class="app-subtitle">Cadastre quem realiza os acompanhamentos da Protege.</p></div></header>
    <section class="panel professional-form-panel">
      <div class="panel-head"><div><span class="section-label">NOVO PROFISSIONAL</span><h2>Dados do profissional</h2></div></div>
      <form id="professionalForm" class="form-grid professional-form">
        <label>Nome completo<input id="professionalName" name="nome" required></label>
        <label>E-mail<input id="professionalEmail" name="email" type="email"></label>
        <label>Telefone<input name="telefone"></label>
        <label>Especialidade / função<input name="especialidade" placeholder="Ex.: Educadora parental"></label>
        <label>Status<select name="status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></label>
        <div class="form-submit-cell"><button class="btn btn-primary" type="submit">Salvar profissional</button></div>
      </form><p id="professionalMessage" class="form-message"></p>
    </section>
    <section class="panel leads-panel"><div class="panel-head"><div><span class="section-label">EQUIPE</span><h2>Profissionais cadastrados</h2></div></div>
      <div class="table-responsive"><table class="data-table" id="professionalsTable"><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Especialidade</th><th>Status</th></tr></thead><tbody><tr><td colspan="5" class="empty-state">Carregando...</td></tr></tbody></table></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=5"></script><script src="script.js?v=9"></script>
</body></html>
